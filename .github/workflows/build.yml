name: Build CDST Desktop App

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt
        
    - name: Build Windows executable
      run: |
        python -m PyInstaller `
          --name CDST `
          --windowed `
          --onedir `
          --noconfirm `
          --clean `
          --add-data "src/cdst;cdst" `
          --collect-all=matplotlib `
          --collect-all=customtkinter `
          --collect-all=scipy `
          --collect-all=Bio `
          --hidden-import=tkinter `
          --hidden-import=pandas `
          --hidden-import=Bio `
          --hidden-import=networkx `
          --hidden-import=scipy `
          --hidden-import=matplotlib `
          --hidden-import=customtkinter `
          cdst_gui_new.py

    - name: Archive Windows portable app
      run: |
        Compress-Archive -Path dist\CDST\* -DestinationPath dist\CDST-Windows-Portable.zip -Force
          
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDST-Windows
        path: dist/CDST-Windows-Portable.zip
        
  build-macos-intel:
    runs-on: macos-13  # Intel-based macOS runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt
        
    - name: Build macOS executable (Intel)
      run: |
        python -m PyInstaller \
          --name CDST \
          --windowed \
          --onefile \
          --add-data "src/cdst:cdst" \
          --hidden-import=tkinter \
          --hidden-import=pandas \
          --hidden-import=Bio \
          --hidden-import=networkx \
          --hidden-import=scipy \
          --hidden-import=matplotlib \
          --hidden-import=customtkinter \
          --osx-bundle-identifier=com.cdst.app \
          cdst_gui_new.py
          
    - name: Upload macOS Intel artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDST-macOS-Intel
        path: dist/CDST.app
        
  build-macos-arm:
    runs-on: macos-latest  # Apple Silicon (M1/M2/M3)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt
        
    - name: Build macOS executable (Apple Silicon)
      run: |
        python -m PyInstaller \
          --name CDST \
          --windowed \
          --onefile \
          --add-data "src/cdst:cdst" \
          --hidden-import=tkinter \
          --hidden-import=pandas \
          --hidden-import=Bio \
          --hidden-import=networkx \
          --hidden-import=scipy \
          --hidden-import=matplotlib \
          --hidden-import=customtkinter \
          --osx-bundle-identifier=com.cdst.app \
          cdst_gui_new.py
          
    - name: Upload macOS ARM artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDST-macOS-ARM
        path: dist/CDST.app
        
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt
        
    - name: Build Linux executable
      run: |
        python -m PyInstaller \
          --name CDST \
          --windowed \
          --onefile \
          --add-data "src/cdst:cdst" \
          --hidden-import=tkinter \
          --hidden-import=pandas \
          --hidden-import=Bio \
          --hidden-import=networkx \
          --hidden-import=scipy \
          --hidden-import=matplotlib \
          --hidden-import=customtkinter \
          cdst_gui_new.py
          
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDST-Linux
        path: dist/CDST
        
  create-release:
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: CDST-*
        merge-multiple: false
        
    - name: Create release archives
      run: |
        zip -r CDST-Windows.zip CDST-Windows/
        zip -r CDST-macOS-Intel.zip CDST-macOS-Intel/
        zip -r CDST-macOS-ARM.zip CDST-macOS-ARM/
        zip -r CDST-Linux.zip CDST-Linux/
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          CDST-Windows.zip
          CDST-macOS-Intel.zip
          CDST-macOS-ARM.zip
          CDST-Linux.zip
        generate_release_notes: true
        draft: false
        prerelease: false
